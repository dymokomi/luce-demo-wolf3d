name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  game:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-demo-wolf3d
      - id: pins
        shell: bash
        run: |
          for pin in BASE UI AUDIO COLOR SVG; do
            key=$(printf '%s' "$pin" | tr '[:upper:]' '[:lower:]')
            echo "$key=$(cat luce-demo-wolf3d/bootstrap/$pin)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-base, ref: "${{ steps.pins.outputs.base }}", path: luce-base}
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-demo-wolf3d/bootstrap/PACKAGES
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-ui, ref: "${{ steps.pins.outputs.ui }}", path: luce-ui}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-audio, ref: "${{ steps.pins.outputs.audio }}", path: luce-audio}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-color, ref: "${{ steps.pins.outputs.color }}", path: luce-color}
      - uses: actions/checkout@v7
        with: {repository: dymokomi/luce-svg, ref: "${{ steps.pins.outputs.svg }}", path: luce-svg}
      - name: Install Linux UI backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - run: cd luce-base && ./build.sh
      - name: CPU contracts
        working-directory: luce-demo-wolf3d
        run: ./test.sh
      - name: Full native link
        working-directory: luce-demo-wolf3d
        run: python3 tools/build.py
